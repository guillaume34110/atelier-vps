name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked client protocol dependencies
        run: uv sync --frozen --no-dev
      - name: Keep disk reserve on disposable hosted runner
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h "$RUNNER_TEMP"
      - name: Install ext4 quota tools for real developer isolation tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends quota
          if ! modinfo quota_v2 > /dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
          fi
          sudo modprobe quota_v2
      - name: Complete unit suite, image build and container integration
        env:
          TASK_WORKSPACE: ${{ runner.temp }}/usevps
          PYTHONDONTWRITEBYTECODE: '1'
        run: uv run --frozen python scripts/checks.py
      - name: Keep concise integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-environment-proof
          path: ${{ runner.temp }}/usevps/evidence
          retention-days: 7
          if-no-files-found: ignore
  macos-widget:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build native widget, run model checks and verify signature
        env:
          TASK_WORKSPACE: ${{ runner.temp }}/usevps-widget
        run: |
          mkdir -p "$TASK_WORKSPACE"
          python3 macos/build.py
      - name: Keep concise Mac build proof
        uses: actions/upload-artifact@v4
        with:
          name: mac-widget-build-proof
          path: ${{ runner.temp }}/usevps-widget/mac-widget-build.json
          retention-days: 7
