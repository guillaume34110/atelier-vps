name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep disk reserve on disposable hosted runner
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h "$RUNNER_TEMP"
      - name: Complete unit suite, image build and container integration
        env:
          TASK_WORKSPACE: ${{ runner.temp }}/usevps
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/checks.py
      - name: Keep concise integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-environment-proof
          path: ${{ runner.temp }}/usevps/evidence
          retention-days: 7
          if-no-files-found: ignore
