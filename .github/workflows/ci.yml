name: CI
on:
  pull_request:
  push:
    branches: [main, setup-vps-offload]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete unit suite, image build and container integration
        env:
          TASK_WORKSPACE: ${{ runner.temp }}/usevps
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/checks.py
