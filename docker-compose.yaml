services:
  worker:
    container_name: ateliervps-worker
    build: .
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 5g
    memswap_limit: 5g
    cpu_shares: 128
    pids_limit: 256
    oom_score_adj: 500
    environment:
      - USEVPS_VOLUME_ID=${USEVPS_VOLUME_ID:-configure-the-added-volume-uuid}
      - USEVPS_RESERVE_GIB=0.5
      - USEVPS_HOST_RAM_RESERVE_GIB=2
      - USEVPS_VOLUME_STATS=/volume-stat
    # Configure the nine explicit binds in Coolify, or generate a local override.
    volumes: []
    logging:
      driver: json-file
      options:
        max-size: 2m
        max-file: "2"
